<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inventario">
<title>Inventario</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #0F1117; color: #E8EAF2; font-family: -apple-system, system-ui, sans-serif; max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  input { background: #0F1117; border: 1.5px solid #2E334D; color: #E8EAF2; border-radius: 10px; padding: 10px 14px; font-size: 15px; width: 100%; outline: none; font-family: inherit; }
  button { font-family: inherit; cursor: pointer; }
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  .header { padding: 20px 20px 10px; border-bottom: 1px solid #2E334D; }
  .header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .header p { color: #7B82A0; font-size: 13px; margin-top: 2px; }
  .actions { display: flex; gap: 10px; padding: 14px 20px; border-bottom: 1px solid #2E334D; }
  .btn { border-radius: 10px; padding: 10px 18px; font-weight: 700; font-size: 15px; border: 2px solid; flex: 1; }
  .btn-green { background: #27C77F; border-color: #27C77F; color: #fff; }
  .btn-red { background: #EF5858; border-color: #EF5858; color: #fff; }
  .btn-outline-green { background: transparent; border-color: #27C77F; color: #27C77F; width: 100%; }
  .btn-outline-red { background: transparent; border-color: #EF5858; color: #EF5858; width: 100%; }
  .btn-blue { background: #4F8EF7; border-color: #4F8EF7; color: #fff; width: 100%; }
  .btn-outline-gray { background: transparent; border-color: #7B82A0; color: #7B82A0; flex: 1; }
  .tabs { display: flex; border-bottom: 1px solid #2E334D; }
  .tab { flex: 1; padding: 12px 0; background: none; border: none; border-bottom: 2.5px solid transparent; color: #7B82A0; font-weight: 400; font-size: 14px; }
  .tab.active { border-bottom-color: #4F8EF7; color: #4F8EF7; font-weight: 700; }
  .content { flex: 1; overflow: auto; padding: 14px 20px 80px; }
  .card { background: #21253A; border-radius: 14px; padding: 14px 16px; border: 1px solid #2E334D; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .card-form { background: #21253A; border-radius: 14px; padding: 14px; border: 1px solid #2E334D; margin-bottom: 14px; }
  .badge { border-radius: 6px; padding: 2px 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; }
  .badge-green { background: #27C77F22; color: #27C77F; border: 1px solid #27C77F44; }
  .badge-yellow { background: #F7A84F22; color: #F7A84F; border: 1px solid #F7A84F44; }
  .badge-red { background: #EF585822; color: #EF5858; border: 1px solid #EF585844; }
  .badge-blue { background: #2A3050; color: #4F8EF7; border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
  .empty { text-align: center; padding: 60px 20px; color: #7B82A0; }
  .empty .icon { font-size: 40px; margin-bottom: 10px; }
  .mov-card { background: #21253A; border-radius: 12px; padding: 12px 14px; border: 1px solid #2E334D; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid; }
  .label { color: #7B82A0; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); color: #fff; border-radius: 10px; padding: 10px 20px; font-weight: 700; font-size: 14px; z-index: 200; white-space: nowrap; box-shadow: 0 4px 20px #0006; transition: opacity .3s; pointer-events: none; }
  .overlay { position: fixed; inset: 0; background: #000a; z-index: 100; display: flex; align-items: flex-end; }
  .sheet { background: #1A1D27; border-radius: 20px 20px 0 0; width: 100%; max-height: 92vh; overflow: auto; padding: 20px; border-top: 3px solid; }
  .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .sheet-title { font-weight: 800; font-size: 18px; }
  .close-btn { background: none; border: none; color: #7B82A0; font-size: 22px; }
  .sku-btn { background: #0F1117; border: 1.5px solid #2E334D; border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 8px; }
  .sku-list { max-height: 220px; overflow-y: auto; }
  .divider { border-top: 1px solid #2E334D; margin: 14px 0; }
  .qty-row { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
  .qty-btn { background: #21253A; border: 1.5px solid #2E334D; color: #E8EAF2; border-radius: 10px; width: 44px; height: 44px; font-size: 22px; flex-shrink: 0; }
  .qty-input { text-align: center; font-weight: 700; font-size: 20px; }
  .row { display: flex; gap: 8px; }
  .stock-info { background: #21253A; border-radius: 12px; padding: 14px; margin-bottom: 14px; border: 1px solid #2E334D; }
  .warn { color: #EF5858; font-size: 13px; margin-bottom: 10px; }
  .muted { color: #7B82A0; }
  .mb8 { margin-bottom: 8px; }
  .mb10 { margin-bottom: 10px; }
  .mb14 { margin-bottom: 14px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ─── Storage ──────────────────────────────────────────────────────
const DEFAULT_CATALOG = [
  { sku: "PROD-001", nombre: "Arroz 1kg" },
  { sku: "PROD-002", nombre: "Aceite 1L" },
  { sku: "PROD-003", nombre: "Harina 1kg" },
];

function loadData(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function saveData(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

// ─── State ────────────────────────────────────────────────────────
let state = {
  catalog: loadData("inv:catalog", DEFAULT_CATALOG),
  inventory: loadData("inv:inventory", {}),
  movimientos: loadData("inv:movimientos", []),
  tab: "inventario",
  modal: null,       // null | "ingreso" | "egreso"
  modalStep: "select",
  skuSel: "",
  skuManual: "",
  nombreManual: "",
  qty: 1,
  search: "",
  newSku: "",
  newNombre: "",
};

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

// ─── Helpers ──────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, color) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.background = color;
  el.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = "0"; }, 2200);
}

function badgeClass(stock) {
  if (stock === 0) return "badge badge-red";
  if (stock < 5) return "badge badge-yellow";
  return "badge badge-green";
}

// ─── Actions ──────────────────────────────────────────────────────
function doMovimiento() {
  const { modal, modalStep, skuSel, skuManual, qty, nombreManual, catalog, inventory, movimientos } = state;
  const skuFinal = modalStep === "manual" ? skuManual : skuSel;
  const catalogEntry = catalog.find(c => c.sku === skuFinal);
  const nombreFinal = catalogEntry?.nombre || nombreManual || skuFinal;
  const qtyN = Number(qty);

  let nextInv = { ...inventory };
  if (modal === "ingreso") {
    const prev = nextInv[skuFinal] || { sku: skuFinal, nombre: nombreFinal, stock: 0 };
    nextInv[skuFinal] = { ...prev, stock: prev.stock + qtyN };
  } else {
    const prev = nextInv[skuFinal];
    if (!prev || prev.stock < qtyN) return;
    nextInv[skuFinal] = { ...prev, stock: prev.stock - qtyN };
  }

  const nextMovs = [{
    id: Date.now(), sku: skuFinal, nombre: nombreFinal, qty: qtyN, tipo: modal,
    fecha: new Date().toLocaleString("es-CL", { dateStyle: "short", timeStyle: "short" }),
  }, ...movimientos];

  saveData("inv:inventory", nextInv);
  saveData("inv:movimientos", nextMovs);

  setState({ inventory: nextInv, movimientos: nextMovs, modal: null, modalStep: "select", skuSel: "", skuManual: "", nombreManual: "", qty: 1, search: "" });
  showToast(modal === "ingreso" ? `+${qtyN} ingresado · ${skuFinal}` : `−${qtyN} descontado · ${skuFinal}`,
    modal === "ingreso" ? "#27C77F" : "#EF5858");
}

function addCatalog() {
  const { newSku, newNombre, catalog } = state;
  if (!newSku || !newNombre) return;
  if (catalog.find(c => c.sku === newSku)) { showToast("SKU ya existe", "#EF5858"); return; }
  const next = [...catalog, { sku: newSku.toUpperCase(), nombre: newNombre }];
  saveData("inv:catalog", next);
  setState({ catalog: next, newSku: "", newNombre: "" });
  showToast(`${newSku.toUpperCase()} agregado al catálogo`, "#4F8EF7");
}

// ─── Render helpers ───────────────────────────────────────────────
function renderInventario() {
  const list = Object.values(state.inventory).sort((a, b) => a.sku.localeCompare(b.sku));
  if (!list.length) return `<div class="empty"><div class="icon">🗃</div><p>Sin productos aún.<br>Registra una compra para comenzar.</p></div>`;
  return list.map(p => `
    <div class="card">
      <div><p style="font-weight:700;font-size:15px">${p.nombre}</p><p style="color:#7B82A0;font-size:12px;margin-top:2px">${p.sku}</p></div>
      <span class="${badgeClass(p.stock)}">${p.stock} u</span>
    </div>`).join("");
}

function renderMovimientos() {
  const { movimientos } = state;
  if (!movimientos.length) return `<div class="empty"><div class="icon">📋</div><p>Sin movimientos registrados.</p></div>`;
  return movimientos.map(m => `
    <div class="mov-card" style="border-left-color:${m.tipo === "ingreso" ? "#27C77F" : "#EF5858"}">
      <div><p style="font-weight:600;font-size:14px">${m.nombre}</p><p style="color:#7B82A0;font-size:11px;margin-top:1px">${m.sku} · ${m.fecha}</p></div>
      <span style="color:${m.tipo === "ingreso" ? "#27C77F" : "#EF5858"};font-weight:800;font-size:16px">${m.tipo === "ingreso" ? "+" : "−"}${m.qty}</span>
    </div>`).join("");
}

function renderCatalogo() {
  const { catalog, newSku, newNombre } = state;
  return `
    <div class="card-form">
      <p class="label">AGREGAR AL CATÁLOGO</p>
      <input class="mb8" placeholder="SKU (ej. PROD-010)" value="${newSku}" oninput="setState({newSku:this.value.toUpperCase()})">
      <input class="mb10" placeholder="Nombre del producto" value="${newNombre}" oninput="setState({newNombre:this.value})">
      <button class="btn btn-blue" onclick="addCatalog()">Agregar</button>
    </div>
    ${catalog.map(c => `
      <div class="card">
        <span style="font-weight:600;font-size:14px">${c.nombre}</span>
        <span class="badge-blue">${c.sku}</span>
      </div>`).join("")}`;
}

function renderModal() {
  const { modal, modalStep, skuSel, skuManual, nombreManual, qty, search, catalog, inventory } = state;
  if (!modal) return "";
  const isIngreso = modal === "ingreso";
  const color = isIngreso ? "#27C77F" : "#EF5858";
  const skuFinal = modalStep === "manual" ? skuManual : skuSel;
  const catalogEntry = catalog.find(c => c.sku === skuFinal);
  const nombreFinal = catalogEntry?.nombre || (modalStep === "manual" ? nombreManual : "");
  const stockActual = inventory[skuFinal]?.stock ?? 0;
  const egresoInvalido = !isIngreso && Number(qty) > stockActual;
  const filtered = catalog.filter(c =>
    c.sku.toLowerCase().includes(search.toLowerCase()) ||
    c.nombre.toLowerCase().includes(search.toLowerCase())
  );

  let body = "";

  if (modalStep === "select") {
    body = `
      <p style="color:#7B82A0;font-size:13px;margin-bottom:12px">Selecciona un SKU del catálogo</p>
      <input class="mb10" placeholder="Buscar SKU o nombre…" value="${search}" oninput="setState({search:this.value})">
      <div class="sku-list">
        ${filtered.map(c => `
          <button class="sku-btn" onclick="setState({skuSel:'${c.sku}',modalStep:'confirm'})">
            <span style="color:#E8EAF2;font-weight:600;font-size:14px">${c.nombre}</span>
            <span style="color:#7B82A0;font-size:12px">${c.sku}</span>
          </button>`).join("") || `<p style="color:#7B82A0;text-align:center;font-size:13px">Sin resultados</p>`}
      </div>
      <div class="divider"></div>
      <button class="btn btn-outline-${isIngreso ? "green" : "red"}" onclick="setState({modalStep:'manual'})">+ Ingresar SKU manualmente</button>`;
  } else if (modalStep === "manual") {
    body = `
      <p style="color:#7B82A0;font-size:13px;margin-bottom:10px">SKU manual</p>
      <input class="mb10" placeholder="SKU (ej. PROD-099)" value="${skuManual}" oninput="setState({skuManual:this.value.toUpperCase()})">
      <input class="mb14" placeholder="Nombre del producto" value="${nombreManual}" oninput="setState({nombreManual:this.value})">
      <div class="row">
        <button class="btn btn-outline-gray" onclick="setState({modalStep:'select'})">← Atrás</button>
        <button class="btn" style="flex:1;background:${color};border-color:${color};color:#fff" onclick="${skuManual ? "setState({modalStep:'confirm'})" : ""}">Continuar</button>
      </div>`;
  } else {
    body = `
      <div class="stock-info">
        <p style="color:#7B82A0;font-size:12px;margin-bottom:2px">SKU</p>
        <p style="font-weight:700;font-size:16px;margin-bottom:6px">${skuFinal}</p>
        ${nombreFinal ? `<p style="color:#7B82A0;font-size:13px">${nombreFinal}</p>` : ""}
        ${!isIngreso ? `<p style="color:#7B82A0;font-size:12px;margin-top:6px">Stock actual: <strong style="color:#E8EAF2">${stockActual}</strong></p>` : ""}
      </div>
      <p style="color:#7B82A0;font-size:13px;margin-bottom:6px">Cantidad</p>
      <div class="qty-row">
        <button class="qty-btn" onclick="setState({qty:Math.max(1,Number(state.qty)-1)})">−</button>
        <input class="qty-input" type="number" min="1" value="${qty}" oninput="setState({qty:Math.max(1,Number(this.value))})">
        <button class="qty-btn" onclick="setState({qty:Number(state.qty)+1})">+</button>
      </div>
      ${egresoInvalido ? `<p class="warn">⚠ Stock insuficiente (${stockActual} disponibles)</p>` : ""}
      <div class="row">
        <button class="btn btn-outline-gray" onclick="setState({modalStep:'select'})">← Atrás</button>
        <button class="btn" style="flex:2;background:${color};border-color:${color};color:#fff;opacity:${egresoInvalido ? 0.4 : 1}" onclick="${egresoInvalido ? "" : "doMovimiento()"}">
          Confirmar ${isIngreso ? "ingreso" : "egreso"}
        </button>
      </div>`;
  }

  return `
    <div class="overlay" onclick="setState({modal:null,modalStep:'select',skuSel:'',skuManual:'',nombreManual:'',qty:1,search:''})">
      <div class="sheet" style="border-top-color:${color}" onclick="event.stopPropagation()">
        <div class="sheet-header">
          <span class="sheet-title" style="color:${color}">${isIngreso ? "▲ Ingreso" : "▼ Egreso"}</span>
          <button class="close-btn" onclick="setState({modal:null,modalStep:'select',skuSel:'',skuManual:'',nombreManual:'',qty:1,search:''})">✕</button>
        </div>
        ${body}
      </div>
    </div>`;
}

// ─── Render ───────────────────────────────────────────────────────
function render() {
  const { tab, inventory } = state;
  const invList = Object.values(inventory);
  const totalUnits = invList.reduce((s, p) => s + p.stock, 0);

  document.getElementById("app").innerHTML = `
    <div class="header">
      <h1>📦 Inventario</h1>
      <p>${invList.length} productos · ${totalUnits} unidades</p>
    </div>
    <div class="actions">
      <button class="btn btn-green" onclick="setState({modal:'ingreso',modalStep:'select'})">▲ Compra</button>
      <button class="btn btn-red" onclick="setState({modal:'egreso',modalStep:'select'})">▼ Venta</button>
    </div>
    <div class="tabs">
      <button class="tab ${tab === "inventario" ? "active" : ""}" onclick="setState({tab:'inventario'})">Stock</button>
      <button class="tab ${tab === "movimientos" ? "active" : ""}" onclick="setState({tab:'movimientos'})">Movimientos</button>
      <button class="tab ${tab === "catalogo" ? "active" : ""}" onclick="setState({tab:'catalogo'})">Catálogo</button>
    </div>
    <div class="content">
      ${tab === "inventario" ? renderInventario() : ""}
      ${tab === "movimientos" ? renderMovimientos() : ""}
      ${tab === "catalogo" ? renderCatalogo() : ""}
    </div>
    ${renderModal()}
  `;
}

// ─── Init ─────────────────────────────────────────────────────────
document.body.insertAdjacentHTML("beforeend", `<div id="toast" class="toast" style="opacity:0"></div>`);
render();
</script>
</body>
</html>
